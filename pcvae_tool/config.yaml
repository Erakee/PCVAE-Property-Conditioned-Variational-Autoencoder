# PCVAE Tool Configuration（推理用，自包含）
# 所有路径相对于 pcvae_tool/ 目录

# ── 数据 ──────────────────────────────────────────────────────────────────────
fname_dataset:    'data/em_train.csv'
token_file:       'data/em_train.smi'
fname_tokenizer:  'data/.tokenizer.pkl'   # 自动生成的 tokenizer 缓存

# ── 权重 ──────────────────────────────────────────────────────────────────────
fname_pcvae_encoder: 'weights/pcvae_encoder.pt'
fname_pcvae_decoder: 'weights/pcvae_decoder.pt'
fname_enthalpy_mpnn: 'weights/enthalpy_mpnn.pt'

# ── PCVAE 推理参数（必须与训练时一致）────────────────────────────────────────
maxLength:  64
embed_dim:  32
threshold:  0.2          # 焓值归一化时的边界扩展比例

vae_param:
  con_dims:    1
  fc_dims:     [2048, 512, 256, 128]
  latent_dim:  64
  hidden_dim:  256
  num_hidden:  4
  num_vocabs:  19        # CVAE_DHR 词表大小（含 <start>/<end>/<pad>）

# ── MPNN（焓预测模型）参数 ────────────────────────────────────────────────────
mpnn_param:
  num_layers: 2
  emb_dim:    256
  in_dim:     42
  edge_dim:   10
  out_dim:    1
