---
 # Project root: resolved relative to this YAML file (keep config.yaml in repo root).
 root_path: '.'
 working_dir: '.'
 fname_dataset: 'data/em_train.csv'
 token_file: 'data/em_train.smi'
 fname_fps: 'data/em_fps.pkl'
 fname_tokenizer: '.tokenizer.pkl'
 fname_enc_params_VAE_H: 'parameters/encoder.pt'
 fname_dec_params_VAE_H: 'parameters/decoder.pt'
 fname_enc_params_CVAE_HC: 'parameters/encoder.pt'
 fname_dec_params_CVAE_HC: 'parameters/decoder.pt'
 fname_enc_params_CVAE_DHR: 'parameters/encoder.pt'
 fname_dec_params_CVAE_DHR: 'parameters/decoder.pt'
 fname_enc_params_CVAE_FiLM: 'parameters/encoder.pt'
 fname_dec_params_CVAE_FiLM: 'parameters/decoder.pt'
 sampled_dir: 'sampled'
 target_sample_dir: 'target_sample'

 # Training: checkpoints live under this folder (relative to root_path unless absolute).
 # Override with env EVAE_TRAINING_RUNS_ROOT.
 training_runs_root: training_params

 # Generation outputs: base folder; scripts write under <generation_output_root>/<model>/...
 # Override with env EVAE_GENERATION_OUTPUT_ROOT.
 generation_output_root: generations

 # Default folders (relative to root_path) containing encoder.pt + decoder.pt per model.
 # Update these after you train, or pass --checkpoint to generate_*.py / generate.py.
 default_generation_checkpoint:
   cvae_dhr: training_params/CVAE_DHR/seed_42
   cvae_hc: training_params/CVAE_HC/seed_42
   vae_h: training_params/VAE_H/seed_42
   cvae_film: training_params/CVAE_FiLM/seed_42

 # Short names -> same checkpoint dirs (relative to root_path). Optional.
 checkpoint_aliases:
   dhr_seed42: training_params/CVAE_DHR/seed_42

 maxLength: 64
 batch_size: 256
 num_epoch: 100
 lr: 5.0e-3
 threshold: 0.2
 embed_dim: 32


 vae_param:
#  soap_dims: 2100
  con_dims: 1
  fc_dims: [2048, 512, 256, 128]
  latent_dim: 64
  hidden_dim: 256 #384
  num_hidden: 4
  num_vocabs: 19  # 运行DHR时19，运行HC时17

 soap_config:
  rcut: 5.0    # 截断半径(Å)
  nmax: 6      # 径向基函数数量
  lmax: 5      # 角动量量子数
  sigma: 0.2   # 高斯宽度(Å